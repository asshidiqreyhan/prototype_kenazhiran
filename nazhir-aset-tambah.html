    /* =========================================================
       KOMPONEN: Map picker koordinat (Leaflet + OpenStreetMap)
       Klik/geser pin -> panggil onPilih("lat, lng"). Field teks tetap
       jadi sumber nilai & fallback bila peta gagal dimuat (offline).
       ========================================================= */
    const uraiKoordinat = (s) => {
      const b = String(s || '').split(',').map((x) => parseFloat(x.trim()));
      return (b.length === 2 && isFinite(b[0]) && isFinite(b[1])) ? [b[0], b[1]] : null;
    };

    const PetaKoordinat = ({ nilai, onPilih }) => {
      const wadahRef = useRef(null);
      const petaRef = useRef(null);
      const markerRef = useRef(null);
      const pilihRef = useRef(onPilih);
      pilihRef.current = onPilih;   // selalu pakai handler terbaru tanpa re-init peta

      useEffect(() => {
        if (!window.L || !wadahRef.current || petaRef.current) return;
        const titikAwal = uraiKoordinat(nilai);
        const pusat = titikAwal || [-6.9147, 107.6098];   // default: Bandung
        const peta = window.L.map(wadahRef.current).setView(pusat, titikAwal ? 15 : 12);
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap',
        }).addTo(peta);

        const ikon = window.L.divIcon({
          className: '',
          html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="#0f766e" stroke="#ffffff" stroke-width="1.2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>',
          iconSize: [32, 32],
          iconAnchor: [16, 32],
        });
        const taruhPin = (lat, lng) => {
          if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
          else markerRef.current = window.L.marker([lat, lng], { icon: ikon }).addTo(peta);
        };
        if (titikAwal) taruhPin(titikAwal[0], titikAwal[1]);

        peta.on('click', (e) => {
          const lat = e.latlng.lat.toFixed(6);
          const lng = e.latlng.lng.toFixed(6);
          taruhPin(parseFloat(lat), parseFloat(lng));
          if (pilihRef.current) pilihRef.current(lat + ', ' + lng);
        });

        petaRef.current = peta;
        setTimeout(() => peta.invalidateSize(), 200);   // container baru tampil -> hitung ulang ukuran
        return () => { peta.remove(); petaRef.current = null; markerRef.current = null; };
      }, []);

      if (!window.L) {
        return (
          <div className="rounded-lg border border-dashed border-gray-300 bg-gray-50 px-4 py-3 text-xs text-gray-500">
            Peta tidak dapat dimuat (perlu koneksi internet). Silakan isi koordinat manual pada kolom di bawah.
          </div>
        );
      }
      return <div ref={wadahRef} className="h-56 w-full overflow-hidden rounded-lg border border-gray-200"></div>;
    };

    /* =========================================================
       HALAMAN UTAMA
       ========================================================= */
    const App = () => {
      const [sidebarTerbuka, setSidebarTerbuka] = useState(false);

      // --- State form (terisi awal dari record EDIT bila mode ubah) ---
      const [nama, setNama] = useState(EDIT ? (EDIT.nama || '') : '');
      const [nilai, setNilai] = useState(EDIT ? formatAngka(EDIT.nilai) : '');
      const [kategori, setKategori] = useState(EDIT ? (EDIT.kategoriId || '') : '');
      const [berkas, setBerkas] = useState({});
      const [syarat, setSyarat] = useState({ laporBulanan: false, bersediaAudit: false });
      // Field detail & legalitas tanah wakaf (nomor AIW, koordinat, peruntukan, dll)
      const [detail, setDetail] = useState(EDIT ? (EDIT.detailTanah || {}) : {});
      const [sentuh, setSentuh] = useState(false);
      const [toast, setToast] = useState('');

      const ubahDetail = (k, v) => setDetail((prev) => ({ ...prev, [k]: v }));

      const kategoriAktif = KATEGORI.find((k) => k.id === kategori);
      const dokumenWajib = kategori ? DOKUMEN_WAJIB[kategori] : [];
      const dokumenOpsional = kategori ? (DOKUMEN_OPSIONAL[kategori] || []) : [];
      const jumlahDokTerunggah = dokumenWajib.filter((d) => berkas[d.key]).length;

      // Teks isian mengikuti kategori terpilih (fallback saat belum memilih)
      const label = TEKS_FIELD[kategori] || TEKS_FIELD.kosong;

      // Ganti kategori -> isian & berkas lama tidak relevan lagi (konteksnya berbeda).
      // Klik ulang kategori yang sama tidak mereset apa pun.
      const pilihKategori = (id) => {
        if (id === kategori) return;
        setKategori(id);
        setBerkas({});
        setNama('');
        setNilai('');
        setDetail({});
        setSentuh(false);
      };

      const pilihBerkas = (key, file) => {
        if (!file) return;
        const meta = {
          nama: file.name,
          ukuran: (file.size / 1024).toFixed(0) + ' KB',
          tipe: file.type || '',
        };
        setBerkas((prev) => ({ ...prev, [key]: meta }));

        // Baca konten untuk pratinjau (best-effort, hanya berkas kecil agar aman kuota)
        if (file.size <= 1.5 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = () => {
            setBerkas((prev) => (prev[key] ? { ...prev, [key]: { ...prev[key], dataUrl: reader.result } } : prev));
          };
          reader.readAsDataURL(file);
        }
      };

      const hapusBerkas = (key) => {
        setBerkas((prev) => {
          const salinan = { ...prev };
          delete salinan[key];
          return salinan;
        });
      };

      const toggleSyarat = (key) => setSyarat((prev) => ({ ...prev, [key]: !prev[key] }));

      // --- Aturan validasi ---
      const semuaSyaratDisetujui = syarat.laporBulanan && syarat.bersediaAudit;
      const dokumenLengkap = dokumenWajib.length > 0 && jumlahDokTerunggah === dokumenWajib.length;
      const dasarLengkap = nama.trim() !== '' && nilai !== '' && kategori !== '';
      const bolehSimpan = dasarLengkap && dokumenLengkap && semuaSyaratDisetujui;

      // Draft cukup butuh kategori + nama/lokasi; sisanya boleh menyusul
      const bisaDraft = kategori !== '' && nama.trim() !== '';

      // Tulis record ke localStorage agar terbaca di halaman Master Aset
      const tulisRecord = (status) => {
        // Daftar dokumen (wajib + opsional): pakai berkas baru; bila mode ubah &
        // belum diunggah ulang, pertahankan entri dari record lama (EDIT.dokumenList).
        const semuaDok = dokumenWajib.concat(dokumenOpsional);
        const dokumenList = semuaDok.map((d) => {
          if (berkas[d.key]) {
            return { key: d.key, label: d.label, nama: berkas[d.key].nama, ukuran: berkas[d.key].ukuran, tipe: berkas[d.key].tipe || '' };
          }
          if (EDIT && EDIT.dokumenList) {
            const lama = EDIT.dokumenList.find((x) => x.key === d.key);
            if (lama) return lama;
          }
          return null;
        }).filter(Boolean);

        const rec = {
          subId: SUB_ID_BARU,
          nib: NIB_LEMBAGA,
          lembaga: 'Yayasan Wakaf Nusantara',
          wilayah: 'BWI Prov. Jawa Barat',
          nama: nama.trim(),
          lokasi: kategori === 'uang' ? 'Rek. Wakaf Produktif' : 'Lokasi aset wakaf',
          kategori: kategoriAktif ? kategoriAktif.nama : '',
          kategoriId: kategori,
          satuan: kategoriAktif ? kategoriAktif.satuan : '',
          nilai: Number(String(nilai).replace(/[^\d]/g, '')) || 0,
          dokumen: dokumenList.length,
          totalDokumen: dokumenWajib.length,
          dokumenList: dokumenList,
          // Detail & legalitas tanah wakaf (untuk aset tidak bergerak)
          detailTanah: (kategori === 'tanah') ? { ...detail } : null,
          status: status,
          tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
        };
        try {
          const list = JSON.parse(localStorage.getItem('data_portofolio_bwi')) || [];
          // Mode ubah: perbarui record dengan Sub-ID yang sama (tidak membuat duplikat)
          const idx = list.findIndex((x) => String(x.subId) === String(SUB_ID_BARU));
          if (idx >= 0) list[idx] = rec;
          else list.push(rec);
          localStorage.setItem('data_portofolio_bwi', JSON.stringify(list));
        } catch (e) { /* mode privat */ }

        // Simpan konten pratinjau di kunci TERPISAH (best-effort) agar record utama
        // tetap kecil & selalu tersimpan meski kuota pratinjau penuh.
        try {

                    <div className="rounded-2xl border border-gray-200 bg-white p-4 shadow-card md:px-6">
                      <div className="flex flex-col-reverse items-stretch gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <p className="flex items-center gap-1.5 text-xs text-gray-400">
                          <Icon name="gembok" className="h-4 w-4 shrink-0" />
                          {bolehSimpan
                            ? 'Semua persyaratan terpenuhi — pengajuan siap dikirim.'
                            : 'Belum lengkap? Simpan dulu sebagai draft, lanjutkan nanti.'}
                        </p>

                        <div className="flex flex-wrap justify-end gap-2">
                          <button
                            type="button"
                            onClick={kembali}
                            className="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-semibold text-gray-600 transition hover:bg-gray-50"
                          >
                            Batal
                          </button>

                          <button
                            type="button"
                            onClick={simpanDraft}
                            disabled={!bisaDraft}
                            title={bisaDraft ? 'Simpan tanpa mengajukan' : 'Pilih kategori dan isi nama/lokasi terlebih dahulu'}
                            className={`inline-flex items-center gap-2 rounded-lg border-2 border-brand-600 bg-white px-5 py-2.5 text-sm font-semibold text-brand-700 transition ${
                              bisaDraft ? 'hover:bg-brand-50' : 'cursor-not-allowed opacity-50'
                            }`}
                          >
                            <Icon name="dokumen" className="h-5 w-5" />
                            Simpan Sebagai Draft
                          </button>

                          <button
                            type="button"
                            onClick={ajukan}
                            disabled={!bolehSimpan}
                            className={`inline-flex items-center gap-2 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition ${
                              bolehSimpan ? 'hover:bg-brand-700' : 'cursor-not-allowed opacity-50'
                            }`}
                          >
                            <Icon name="centang" className="h-5 w-5" />
                            Ajukan untuk Verifikasi
                          </button>
                        </div>
                      </div>

                      <div className="mt-3 flex items-start gap-2 border-t border-gray-100 pt-3">
                        <Icon name="info" className="mt-0.5 h-4 w-4 shrink-0 text-gray-400" />
                        <p className="text-xs leading-relaxed text-gray-500">
                          <span className="font-semibold text-gray-600">Draft</span> tersimpan tanpa masuk antrean dan
                          masih bisa diedit. <span className="font-semibold text-gray-600">Ajukan</span> mengirim berkas
                          ke status <span className="font-semibold text-amber-700">Verifikasi Pusat</span> — Sub-ID baru
                          menjadi <span className="font-semibold text-brand-700">Aktif</span> hanya setelah disetujui BWI Pusat.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* ============ KOLOM RINGKASAN ============ */}
                  <div className="lg:col-span-1">
                    <PanelRingkasan
                      nama={nama}
                      nilai={nilai}
                      kategoriAktif={kategoriAktif}
                      jumlahDok={jumlahDokTerunggah}
                      totalDok={dokumenWajib.length}
                      syarat={syarat}
                      label={label}
                    />
                  </div>
                </div>
              </div>
            </main>

            <footer className="border-t border-gray-200 bg-white py-4 text-center text-xs text-gray-400">
              Badan Wakaf Indonesia &copy; 2026 &middot; Titik Terang OS &middot; Modul Kenazhiran
            </footer>
          </div>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-[80] flex max-w-sm items-center gap-3 rounded-xl bg-gray-900 px-5 py-3 text-sm font-medium text-white shadow-2xl">
              <Icon name="centangLingkaran" className="h-5 w-5 shrink-0 text-brand-400" />
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <!-- Penjaga akun dibekukan: read-only global (blokir aksi CUD) -->
  <script>
    (function () {
      var LEMBAGA = 'NZHR-BDG-170';
      function beku() { try { var o = JSON.parse(localStorage.getItem('status_nazhir_bwi')); return !!(o && o[LEMBAGA] === 'dibekukan'); } catch (e) { return false; } }
      if (!beku()) return;

      // Aksi baca / tutup modal / navigasi -> tetap diizinkan
      var ALLOW = /(lihat|kembali|keluar|template|unduh|cari|tutup|detail|sebelumnya|berikutnya|logout|masuk)/i;
      // Aksi ubah data (Create/Update/Delete) -> diblokir
      var CUD = /(tambah|buat|simpan|ajukan|kirim|hapus|batalkan|lengkapi|ubah|edit|unggah|upload|setuju|tolak|perbaiki)/i;

      function aksiCUD(el) {
        if (!el || !el.getAttribute) return false;
        if (el.hasAttribute('data-lengkapi') || el.hasAttribute('data-hapus')) return true;
        var da = el.getAttribute('data-aksi');
        if (da && /batal|hapus|ubah|edit/i.test(da)) return true;
        var teks = (el.textContent || '') + ' ' + (el.getAttribute('onclick') || '');
        if (ALLOW.test(teks)) return false;
        return CUD.test(teks);
      }

      // Interseptor klik fase-capture: hentikan sebelum handler CUD berjalan
      document.addEventListener('click', function (e) {
        var el = e.target.closest('button,a,[data-lengkapi],[data-hapus],[data-aksi]');
        if (!el) return;
        if (aksiCUD(el)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          if (window.showToast) showToast('Akun dibekukan — aksi ini dinonaktifkan. Hubungi BWI Pusat.');
        }
      }, true);

      document.addEventListener('DOMContentLoaded', function () {
        // Redupkan tombol CUD statis sebagai penanda read-only
        document.querySelectorAll('button').forEach(function (b) {
          if (aksiCUD(b)) b.classList.add('opacity-50', 'cursor-not-allowed');
        });
        // Banner read-only (lewati halaman yang sudah punya #bannerCutoff sendiri)
        if (document.getElementById('bannerCutoff')) return;
        var host = document.querySelector('main .mx-auto') || document.querySelector('main');
        if (!host) return;
        var b = document.createElement('div');
        b.className = 'mb-4 flex items-start gap-3 rounded-2xl border border-rose-200 bg-rose-50 px-5 py-4';
        b.innerHTML = '<svg class="mt-0.5 h-5 w-5 shrink-0 text-rose-600" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg><div><p class="text-sm font-bold text-rose-800">Akun Anda dibekukan</p><p class="mt-0.5 text-xs text-rose-800">Anda hanya dapat melihat data (read-only) &mdash; menambah, mengubah, dan menghapus dinonaktifkan. Hubungi BWI Pusat untuk pengaktifan kembali.</p></div>';
        host.insertBefore(b, host.firstChild);
      });
    })();
  </script>


  <!-- Mode Calon Nazhir: shell penuh, read-only, banner status-aware (aktif bila sesi=calon) -->
  <script>
    (function () {
      var sesi = {};
      try { sesi = JSON.parse(localStorage.getItem('sesi_kenazhiran')) || {}; } catch (e) { sesi = {}; }
      // Pasca-aktivasi (khusus dashboard): kartu akses SK (persisten) + banner "Selamat" (sekali)
      document.addEventListener('DOMContentLoaded', function () {
        var path = (location.pathname.split('/').pop() || '').toLowerCase();
        if (path !== 'nazhir-dashboard.html') return;
        var r = {}; try { r = JSON.parse(localStorage.getItem('pendaftaran_nazhir_bwi')) || {}; } catch (e) { }
        if (r.status !== 'aktif' || !r.nib || sesi.nama !== r.namaBadanHukum) return;
        var main = document.querySelector('main'); if (!main) return;
        var host = main.querySelector('.max-w-screen-2xl') || main;
        function esc2(t) { var e = document.createElement('div'); e.textContent = t == null ? '' : String(t); return e.innerHTML; }
        var kartu = document.createElement('div');
        kartu.className = 'mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-gray-200 bg-white px-5 py-4 shadow-card';
        kartu.innerHTML = '<div class="flex items-center gap-3"><span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-600"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg></span><div><p class="text-sm font-bold text-gray-800">Sertifikat Keputusan (SK) Nazhir</p><p class="text-xs text-gray-400">NIB ' + esc2(r.nib) + ' \u00b7 Terbit ' + esc2(r.tglSertifikat || '-') + '</p></div></div>' +
          '<a href="nazhir-sk.html" class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-700"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>Preview / Download SK</a>';
        host.insertBefore(kartu, host.firstChild);
        var flag = null; try { flag = localStorage.getItem('graduasi_baru_bwi'); } catch (e) { }
        if (flag) {
          try { localStorage.removeItem('graduasi_baru_bwi'); } catch (e) { }
          var div = document.createElement('div');
          div.className = 'mb-6 flex flex-wrap items-start gap-3 rounded-2xl border border-brand-200 bg-brand-50 px-5 py-4';
          div.innerHTML = '<svg class="mt-0.5 h-6 w-6 shrink-0 text-brand-600" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>' +
            '<div><p class="text-sm font-bold text-brand-800">Selamat! Akun Anda kini aktif sebagai Nazhir</p><p class="mt-0.5 text-xs text-brand-700">Pendaftaran Anda telah disetujui BWI Pusat. NIB &amp; Sertifikat Keputusan (SK) telah terbit dan seluruh menu kini dapat diakses.</p></div>';
          host.insertBefore(div, host.firstChild);
        }
      });

      if (sesi.mode !== 'calon') return;


      var reg = {};
      try { reg = JSON.parse(localStorage.getItem('pendaftaran_nazhir_bwi')) || {}; } catch (e) { reg = {}; }
      var STATUS = reg.status || 'draft';

      // Graduasi: pendaftaran disetujui -> menjadi Nazhir Aktif (akses penuh, guard nonaktif)
      if (STATUS === 'aktif') {
        try { localStorage.setItem('sesi_kenazhiran', JSON.stringify({ mode: 'aktif', nama: reg.namaBadanHukum })); } catch (e) { }
        try { localStorage.setItem('graduasi_baru_bwi', '1'); } catch (e) { }
        return;
      }

      var NAMA = reg.namaBadanHukum || sesi.nama || 'Calon Nazhir';
      function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
      function inisial(n) { var p = String(n || 'CN').trim().split(/\s+/); return ((p[0] || 'C')[0] + ((p[1] || p[0] || 'N')[0] || 'N')).toUpperCase().slice(0, 2); }
      function progres() { var ada = 0; try { ada = Object.keys(reg.berkas || {}).length; } catch (e) { } return { ada: ada, total: 16, persen: Math.round((ada / 16) * 100) }; }
      var CEK = '<svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';

      var editable = ['draft', 'revisi', 'ditolak'].indexOf(STATUS) !== -1;
      var CTA = editable ? (STATUS === 'ditolak' ? 'Daftar Ulang' : (STATUS === 'revisi' ? 'Perbaiki Berkas' : 'Lanjutkan Pendaftaran')) : 'Lihat Detail Pendaftaran';

      function bannerConf() {
        var cat = reg.catatanPusat ? ' <span class="font-semibold">Catatan Pusat:</span> ' + esc(reg.catatanPusat) : '';
        if (STATUS === 'revisi') return ['orange', 'Berkas perlu diperbaiki (Revisi)', 'BWI Pusat meminta perbaikan berkas.' + cat + ' Klik <b>Perbaiki Berkas</b> untuk memperbaiki lalu ajukan ulang.'];
        if (STATUS === 'ditolak') return ['red', 'Pendaftaran ditolak', 'Maaf, pengajuan Anda tidak disetujui.' + cat + ' Anda dapat mendaftar ulang dari awal.'];
        if (STATUS === 'diajukan') return ['amber', 'Berkas sedang diverifikasi BWI Pusat', 'Pengajuan Anda diterima & sedang diperiksa. Klik <b>Lihat Detail</b> untuk memantau.'];
        if (STATUS === 'diverifikasi') return ['emerald', 'Dokumen terverifikasi BWI Pusat', 'Berkas Anda lengkap & terverifikasi. Menunggu penjadwalan presentasi/wawancara. Klik untuk detail.'];
        if (STATUS === 'terjadwal') return ['blue', 'Disetujui verifikasi &mdash; jadwal presentasi ditetapkan', 'BWI Pusat menetapkan jadwal presentasi/wawancara Anda: <b>' + esc(reg.jadwalPresentasi || '-') + '</b>. Klik <b>Lihat Detail</b> untuk jadwal &amp; link lengkap.'];
        if (STATUS === 'persetujuan') return ['violet', 'Lulus presentasi &mdash; menunggu persetujuan akhir', 'Selangkah lagi. Pengajuan Anda menunggu persetujuan akhir &amp; penerbitan sertifikat. Klik untuk detail.'];
        return ['amber', 'Anda berstatus Calon Nazhir', 'Lengkapi berkas pendaftaran &rarr; menunggu verifikasi BWI Pusat &rarr; akun menjadi <b>Nazhir Aktif</b>. Menu lain read-only hingga akun aktif.'];
      }
      function warnaMap(w) {
        return {
          amber: ['border-amber-200 bg-amber-50', 'text-amber-600', 'text-amber-800'],
          orange: ['border-orange-200 bg-orange-50', 'text-orange-600', 'text-orange-800'],
          red: ['border-red-200 bg-red-50', 'text-red-600', 'text-red-800'],
          emerald: ['border-emerald-200 bg-emerald-50', 'text-emerald-600', 'text-emerald-800'],
          blue: ['border-blue-200 bg-blue-50', 'text-blue-600', 'text-blue-800'],
          violet: ['border-violet-200 bg-violet-50', 'text-violet-600', 'text-violet-800']
        }[w];
      }
      function banner() {
        var b = bannerConf(), c = warnaMap(b[0]);
        return '<div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border ' + c[0] + ' px-5 py-4">' +
          '<div class="flex items-start gap-3"><svg class="mt-0.5 h-5 w-5 shrink-0 ' + c[1] + '" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" /></svg>' +
          '<div><p class="text-sm font-bold ' + c[2] + '">' + b[1] + '</p><p class="mt-0.5 text-xs ' + c[2] + '">' + b[2] + '</p></div></div>' +
          '<a href="nazhir-pendaftaran.html" class="shrink-0 rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-700">' + CTA + '</a></div>';
      }
      function barProgres(p) {
        return '<div><div class="flex items-center justify-between text-sm"><span class="font-semibold text-gray-700">' + p.ada + ' dari ' + p.total + ' berkas terunggah</span><span class="font-bold text-brand-700">' + p.persen + '%</span></div>' +
          '<div class="mt-2 h-2.5 w-full overflow-hidden rounded-full bg-gray-100"><div class="h-full rounded-full bg-brand-500" style="width:' + p.persen + '%"></div></div></div>';
      }
      function idxDash() {
        if (STATUS === 'persetujuan') return 3;
        if (STATUS === 'diverifikasi' || STATUS === 'terjadwal') return 2;
        if (STATUS === 'diajukan' || STATUS === 'revisi' || STATUS === 'ditolak') return 1;
        return 0;
      }
      function stepsDash() {
        var cur = idxDash();
        return ['Lengkapi Berkas', 'Verifikasi Pusat', 'Presentasi/Wawancara', 'Keputusan', 'Sertifikat Terbit'].map(function (s, i) {
          var done = i < cur, act = i === cur;
          var lingk = done ? 'bg-brand-600 text-white' : act ? 'bg-brand-100 text-brand-700 ring-2 ring-brand-500' : 'bg-gray-100 text-gray-400';
          return '<li class="flex items-center gap-2 rounded-lg border ' + (act ? 'border-brand-200 bg-brand-50' : 'border-gray-100 bg-gray-50') + ' px-3 py-2"><span class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold ' + lingk + '">' + (done ? CEK : (i + 1)) + '</span><span class="' + (done || act ? 'text-gray-700' : 'text-gray-400') + '">' + s + '</span></li>';
        }).join('');
      }
      function isiDashboard(p) {
        return '<div class="mx-auto max-w-screen-2xl space-y-6 p-4 md:p-6">' + banner() +
          '<div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-card">' +
          '<p class="text-sm text-gray-400">Selamat datang,</p><h2 class="text-xl font-bold text-gray-800">' + esc(NAMA) + '</h2>' +
          '<div class="mt-5 grid grid-cols-1 gap-5 md:grid-cols-2">' +
          '<div class="rounded-xl border border-dashed border-gray-300 bg-gray-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-gray-400">Nomor Induk BWI (NIB)</p><p class="mt-1 font-mono text-lg font-bold text-gray-400">Belum Terbit</p><p class="mt-0.5 text-xs text-gray-400">NIB terbit otomatis setelah pendaftaran disetujui BWI Pusat.</p></div>' +
          '<div class="rounded-xl border border-gray-200 p-4">' + barProgres(p) + '<a href="nazhir-pendaftaran.html" class="mt-3 inline-flex rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-700">' + CTA + '</a></div>' +
          '</div></div>' +
          '<div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-card"><h3 class="text-base font-bold text-gray-800">Tahapan menuju Nazhir Aktif</h3>' +
          '<ol class="mt-4 grid grid-cols-1 gap-3 text-sm sm:grid-cols-2 lg:grid-cols-5">' + stepsDash() + '</ol></div></div>';
      }
      function isiKosong(p) {
        return '<div class="mx-auto max-w-screen-2xl space-y-6 p-4 md:p-6">' + banner() +
          '<div class="flex flex-col items-center justify-center rounded-2xl border border-gray-200 bg-white px-6 py-16 text-center shadow-card">' +
          '<span class="flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-400"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg></span>' +
          '<h3 class="mt-4 text-lg font-bold text-gray-800">Fitur tersedia setelah akun aktif</h3>' +
          '<p class="mt-1 max-w-md text-sm text-gray-500">Menu ini akan berisi data setelah pendaftaran Anda disetujui BWI Pusat dan akun menjadi Nazhir Aktif.</p>' +
          '<div class="mt-5 w-full max-w-sm">' + barProgres(p) + '</div>' +
          '<a href="nazhir-pendaftaran.html" class="mt-5 inline-flex rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700">' + CTA + '</a>' +
          '</div></div>';
      }
      function gantiTeks(dari, ke) {
        var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), t = [];
        while (w.nextNode()) { if (w.currentNode.nodeValue.indexOf(dari) !== -1) t.push(w.currentNode); }
        t.forEach(function (n) { n.nodeValue = n.nodeValue.split(dari).join(ke); });
      }
      function gantiTeksExact(dari, ke) {
        var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), t = [];
        while (w.nextNode()) { if (w.currentNode.nodeValue.trim() === dari) t.push(w.currentNode); }
        t.forEach(function (n) { n.nodeValue = n.nodeValue.replace(dari, ke); });
      }

      document.addEventListener('DOMContentLoaded', function () {
        gantiTeks('Yayasan Wakaf Nusantara', NAMA);
        gantiTeks('Nazhir Aktif', 'Calon Nazhir');
        gantiTeksExact('YN', inisial(NAMA));

        var path = (location.pathname.split('/').pop() || '').toLowerCase();
        if (path === 'nazhir-pendaftaran.html') return;
        var main = document.querySelector('main');
        if (!main) return;
        var p = progres();
        main.innerHTML = (path === 'nazhir-dashboard.html') ? isiDashboard(p) : isiKosong(p);
      });
    })();
  </script>
