    /* =========================================================

       ========================================================= */

    const PREFIX_NIB = NIB_LEMBAGA.replace(/-\d+$/, '');   // 'NZHR-BDG'

    // Dokumen wajib per kategori — dasar conditional rendering

      uang: [
        { key: 'lkspwu', label: 'Dokumen Rekomendasi LKS PWU', hint: 'Surat rekomendasi dari Lembaga Keuangan Syariah Penerima Wakaf Uang' },
        { key: 'operasional', label: 'Surat Pernyataan Memiliki Biaya Operasional', hint: 'Pernyataan kesanggupan menanggung biaya operasional pengelolaan' },
      ],
      tanah: [
        { key: 'bpn', label: 'Sertifikat BPN', hint: 'Sertifikat hak atas tanah yang diterbitkan Badan Pertanahan Nasional' },
        { key: 'aiw', label: 'AIW (Akta Ikrar Wakaf)', hint: 'Akta Ikrar Wakaf yang dibuat di hadapan PPAIW' },
      ],
    };

    const KATEGORI = [
      { id: 'uang', nama: 'Wakaf Uang', ikon: 'uang', satuan: 'Rp', keterangan: 'Setoran wakaf tunai melalui LKS PWU' },
      { id: 'tanah', nama: 'Wakaf Tanah', ikon: 'tanah', satuan: 'M²', keterangan: 'Tanah wakaf bersertifikat & ber-AIW' },
    ];

    const SYARAT_LEGAL = [
      { key: 'laporRutin', teks: 'Saya bersedia menyampaikan laporan mutasi wakaf secara rutin/bulanan.' },
      { key: 'bersediaAudit', teks: 'Saya bersedia diaudit terkait laporan pengelolaan portofolio wakaf ini.' },
    ];

    const formatAngka = (n) => {
      const angka = Number(String(n).replace(/[^\d]/g, ''));
      return isNaN(angka) ? '' : angka.toLocaleString('id-ID');
    };

       KOMPONEN: Sidebar (layout eksisting — dipertahankan)
       ========================================================= */

      const menu = [
        { label: 'Dashboard NIB', ikon: 'kartu', aktif: false },
        { label: 'Master Aset & Portofolio', ikon: 'bangunan', aktif: true },
        { label: 'Pelaporan Mutasi Aset', ikon: 'dokumen', aktif: false },
        { label: 'Riwayat & Dokumen', ikon: 'arsip', aktif: false },
      ];

      return (
        <aside
          id="sidebar"
          className={`absolute left-0 top-0 z-50 flex h-screen w-[290px] flex-col overflow-y-hidden bg-brand-900 duration-300 ease-linear lg:static lg:translate-x-0 ${terbuka ? 'translate-x-0' : '-translate-x-full'}`}
        >

              <ul className="mb-6 flex flex-col gap-1.5">

                  <li key={m.label}>
                    <a

                <span className="block truncate text-sm font-semibold text-white">Yayasan Wakaf Nusantara</span>
                <span className="block truncate text-[11px] text-gray-400">Nazhir Aktif</span>
              </span>
            </div>
            <button className="flex w-full items-center gap-3 rounded-lg px-4 py-2.5 text-sm font-medium text-gray-300 duration-300 ease-in-out hover:bg-white/10 hover:text-white">

    /* =========================================================

              className="z-50 block rounded-lg border border-gray-200 bg-white p-2 text-gray-500 hover:text-brand-700 lg:hidden"

            <div className="min-w-0">

              <span className="absolute -top-0.5 right-0 z-10 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"></span>
              <Icon name="lonceng" className="h-5 w-5" />
            </button>

            <div className="flex items-center gap-3">
              <span className="hidden text-right lg:block">

                <span className="block text-xs font-medium text-brand-600">Nazhir Aktif</span>

              <span className="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-sm font-bold text-brand-700">YN</span>

    /* =========================================================

       ========================================================= */
    const FieldUnggah = ({ dok, berkas, onPilih, onHapus }) => (
      <div className="fade-in">
        <label className="mb-1.5 block text-sm font-semibold text-gray-700">
          {dok.label} <span className="text-red-500">*</span>
        </label>

        {!berkas ? (
          <label
            htmlFor={`file-${dok.key}`}
            className="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 px-4 py-6 text-center transition hover:border-brand-400 hover:bg-brand-50/40"
          >
            <Icon name="unggah" className="h-7 w-7 text-gray-400" />
            <span className="text-sm text-gray-500">
              Drag &amp; Drop berkas atau <span className="font-semibold text-brand-700">Browse</span>
            </span>
            <span className="text-xs text-gray-400">Format .pdf / .jpg / .png &middot; maks. 5 MB</span>

              id={`file-${dok.key}`}
              type="file"
              className="hidden"
              accept=".pdf,.jpg,.jpeg,.png"
              onChange={(e) => onPilih(dok.key, e.target.files && e.target.files[0])}

        ) : (
          <div className="flex items-center justify-between gap-3 rounded-xl border border-brand-200 bg-brand-50 px-4 py-3">

                <p className="truncate text-sm font-semibold text-gray-800">{berkas.nama}</p>
                <p className="text-xs text-brand-700">{berkas.ukuran} &middot; Siap diunggah</p>
              </div>
            </div>
            <button
              type="button"
              onClick={() => onHapus(dok.key)}
              title="Hapus berkas"
              className="inline-flex shrink-0 items-center justify-center rounded-lg border border-gray-300 bg-white p-2 text-gray-400 transition hover:border-red-300 hover:bg-red-50 hover:text-red-600"

              <Icon name="sampah" className="h-4 w-4" />
            </button>
          </div>

        <p className="mt-1.5 text-xs text-gray-400">{dok.hint}</p>
      </div>
    );

    /* =========================================================
       KOMPONEN: Modal Tambah Portofolio Aset (Sub-ID)
       ========================================================= */
    const ModalTambahPortofolio = ({ terbuka, tutup, onSimpan, subIdBerikutnya }) => {
      const [nama, setNama] = useState('');
      const [nilai, setNilai] = useState('');
      const [kategori, setKategori] = useState('');
      const [berkas, setBerkas] = useState({});
      const [syarat, setSyarat] = useState({ laporRutin: false, bersediaAudit: false });
      const [sentuh, setSentuh] = useState(false);

      // Reset form setiap kali modal dibuka
      useEffect(() => {
        if (terbuka) {
          setNama(''); setNilai(''); setKategori('');
          setBerkas({}); setSyarat({ laporRutin: false, bersediaAudit: false });
          setSentuh(false);
        }
      }, [terbuka]);

      const kategoriAktif = KATEGORI.find((k) => k.id === kategori);
      const dokumenWajib = kategori ? DOKUMEN_WAJIB[kategori] : [];

      // Ganti kategori -> berkas lama tidak relevan lagi
      const pilihKategori = (id) => {
        setKategori(id);
        setBerkas({});
      };

      const pilihBerkas = (key, file) => {
        if (!file) return;
        setBerkas((prev) => ({
          ...prev,
          [key]: { nama: file.name, ukuran: (file.size / 1024).toFixed(0) + ' KB' },
        }));
      };

      const hapusBerkas = (key) => {
        setBerkas((prev) => {
          const salinan = { ...prev };
          delete salinan[key];
          return salinan;
        });
      };

      const toggleSyarat = (key) =>
        setSyarat((prev) => ({ ...prev, [key]: !prev[key] }));

      // Kedua checkbox legal WAJIB dicentang
      const semuaSyaratDisetujui = syarat.laporRutin && syarat.bersediaAudit;
      const dokumenLengkap = dokumenWajib.length > 0 && dokumenWajib.every((d) => berkas[d.key]);
      const dasarLengkap = nama.trim() !== '' && nilai !== '' && kategori !== '';

      const bolehSimpan = dasarLengkap && dokumenLengkap && semuaSyaratDisetujui;

      const simpan = () => {
        setSentuh(true);
        if (!bolehSimpan) return;
        onSimpan({
          subId: subIdBerikutnya,
          nama: nama.trim(),
          kategori: kategoriAktif.nama,
          kategoriId: kategori,
          satuan: kategoriAktif.satuan,
          nilai: Number(String(nilai).replace(/[^\d]/g, '')) || 0,
          dokumen: Object.keys(berkas).length,
        });
      };

      if (!terbuka) return null;

      return (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/50" onClick={tutup}></div>

          <div className="modal-in relative flex max-h-[92vh] w-full max-w-2xl flex-col rounded-2xl bg-white shadow-2xl">

            {/* Header modal */}
            <div className="flex items-start justify-between gap-3 border-b border-gray-100 px-6 py-5">
              <div>
                <h3 className="text-lg font-bold text-gray-800">Tambah Portofolio Aset (Sub-ID)</h3>
                <p className="mt-0.5 text-xs text-gray-400">
                  Aset baru akan terdaftar sebagai{' '}
                  <span className="font-mono font-semibold text-brand-700">{subIdBerikutnya}</span> di bawah NIB{' '}
                  <span className="font-mono font-semibold text-gray-500">{NIB_LEMBAGA}</span>.
                </p>
              </div>
              <button onClick={tutup} className="text-gray-400 transition hover:text-gray-600">
                <Icon name="silang" className="h-6 w-6" />
              </button>
            </div>

            {/* Body modal (scrollable) */}
            <div className="space-y-6 overflow-y-auto px-6 py-5">

              {/* SECTION 1 — Data dasar aset */}
              <div>
                <h4 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-gray-500">
                  <span className="flex h-6 w-6 items-center justify-center rounded-full bg-brand-50 text-[11px] font-bold text-brand-700">1</span>
                  Data Dasar Aset
                </h4>

                <div className="grid grid-cols-1 gap-x-5 gap-y-4 md:grid-cols-2">
                  <div className="md:col-span-2">
                    <label className="mb-1.5 block text-sm font-semibold text-gray-700">
                      Nama / Lokasi Aset <span className="text-red-500">*</span>
                    </label>
                    <input
                      type="text"
                      value={nama}
                      onChange={(e) => setNama(e.target.value)}
                      placeholder="mis. Tanah Wakaf Jl. Merdeka, Semarang"
                      className={`w-full rounded-lg border bg-white px-4 py-2.5 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-brand-100 ${
                        sentuh && !nama.trim() ? 'border-red-300 focus:border-red-500' : 'border-gray-200 focus:border-brand-500'
                      }`}
                    />
                    {sentuh && !nama.trim() && (
                      <p className="mt-1.5 text-xs font-medium text-red-600">Nama / lokasi aset wajib diisi.</p>
                    )}
                  </div>

                  <div className="md:col-span-2">
                    <label className="mb-1.5 block text-sm font-semibold text-gray-700">
                      Nilai / Luas Dasar <span className="text-red-500">*</span>
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        inputMode="numeric"
                        value={nilai}
                        onChange={(e) => setNilai(formatAngka(e.target.value))}
                        placeholder="0"
                        className={`w-full rounded-lg border bg-white py-2.5 pl-4 pr-16 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-brand-100 ${
                          sentuh && !nilai ? 'border-red-300 focus:border-red-500' : 'border-gray-200 focus:border-brand-500'
                        }`}
                      />
                      <span className="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 rounded-md bg-gray-100 px-2 py-1 text-xs font-semibold text-gray-500">
                        {kategoriAktif ? kategoriAktif.satuan : '—'}
                      </span>
                    </div>
                    <p className="mt-1.5 text-xs text-gray-400">
                      Satuan menyesuaikan kategori wakaf yang dipilih (Rupiah untuk Wakaf Uang, M² untuk Wakaf Tanah).
                    </p>
                    {sentuh && !nilai && (
                      <p className="mt-1 text-xs font-medium text-red-600">Nilai / luas dasar wajib diisi.</p>
                    )}
                  </div>
                </div>
              </div>

              {/* SECTION 2 — Kategori wakaf */}
              <div>
                <h4 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-gray-500">
                  <span className="flex h-6 w-6 items-center justify-center rounded-full bg-brand-50 text-[11px] font-bold text-brand-700">2</span>
                  Kategori Wakaf
                </h4>

                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                  {KATEGORI.map((k) => {
                    const aktif = kategori === k.id;
                    return (
                      <button
                        key={k.id}
                        type="button"
                        onClick={() => pilihKategori(k.id)}
                        className={`flex items-start gap-3 rounded-xl border-2 p-4 text-left transition ${
                          aktif
                            ? 'border-brand-500 bg-brand-50 ring-2 ring-brand-100'
                            : 'border-gray-200 bg-white hover:border-brand-300 hover:bg-brand-50/40'
                        }`}
                      >
                        <span className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-lg ${aktif ? 'bg-brand-600 text-white' : 'bg-gray-100 text-gray-500'}`}>
                          <Icon name={k.ikon} className="h-5 w-5" />
                        </span>
                        <span className="min-w-0">
                          <span className="flex items-center gap-1.5">
                            <span className={`text-sm font-bold ${aktif ? 'text-brand-800' : 'text-gray-800'}`}>{k.nama}</span>
                            {aktif && <Icon name="centangLingkaran" className="h-4 w-4 text-brand-600" />}
                          </span>
                          <span className="mt-0.5 block text-xs text-gray-500">{k.keterangan}</span>
                        </span>
                      </button>
                    );
                  })}
                </div>

                {sentuh && !kategori && (
                  <p className="mt-2 text-xs font-medium text-red-600">Silakan pilih kategori wakaf terlebih dahulu.</p>
                )}
              </div>

              {/* SECTION 3 — Dokumen wajib (CONDITIONAL RENDERING) */}
              <div>
                <h4 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-gray-500">
                  <span className="flex h-6 w-6 items-center justify-center rounded-full bg-brand-50 text-[11px] font-bold text-brand-700">3</span>
                  Dokumen Persyaratan
                </h4>

                {!kategori ? (
                  <div className="flex items-start gap-3 rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-6">
                    <Icon name="info" className="mt-0.5 h-5 w-5 shrink-0 text-gray-400" />
                    <p className="text-sm text-gray-500">
                      Pilih kategori wakaf di atas untuk menampilkan dokumen persyaratan yang harus diunggah.
                    </p>
                  </div>
                ) : (
                  <div className="fade-in space-y-4">
                    <div className="flex items-start gap-3 rounded-xl border border-brand-100 bg-brand-50 px-4 py-3">
                      <Icon name="info" className="mt-0.5 h-5 w-5 shrink-0 text-brand-600" />
                      <p className="text-xs leading-relaxed text-brand-800">
                        Kategori <span className="font-semibold">{kategoriAktif.nama}</span> mensyaratkan{' '}
                        <span className="font-semibold">{dokumenWajib.length} dokumen</span> berikut. Seluruh berkas wajib
                        diunggah sebelum portofolio dapat disimpan.
                      </p>
                    </div>

                    {dokumenWajib.map((dok) => (
                      <FieldUnggah
                        key={dok.key}
                        dok={dok}
                        berkas={berkas[dok.key]}
                        onPilih={pilihBerkas}
                        onHapus={hapusBerkas}
                      />
                    ))}

                    {sentuh && !dokumenLengkap && (
                      <p className="text-xs font-medium text-red-600">
                        Seluruh dokumen persyaratan wajib diunggah.
                      </p>
                    )}
                  </div>
                )}
              </div>

              {/* SECTION 4 — Syarat & ketentuan legal (pengganti dokumen fisik) */}
              <div>
                <h4 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-gray-500">
                  <span className="flex h-6 w-6 items-center justify-center rounded-full bg-brand-50 text-[11px] font-bold text-brand-700">4</span>
                  Syarat &amp; Ketentuan Legal
                </h4>

                <div className="space-y-2.5 rounded-xl border border-amber-200 bg-amber-50 p-4">
                  <div className="flex items-start gap-2.5 pb-1">
                    <Icon name="peringatan" className="mt-0.5 h-5 w-5 shrink-0 text-amber-600" />
                    <p className="text-xs leading-relaxed text-amber-800">
                      Pernyataan digital berikut menggantikan surat pernyataan fisik dan mengikat secara hukum.
                      Keduanya <span className="font-semibold">wajib disetujui</span> untuk melanjutkan.
                    </p>
                  </div>

                  {SYARAT_LEGAL.map((s) => (
                    <label
                      key={s.key}
                      className={`flex cursor-pointer items-start gap-3 rounded-lg border bg-white p-3.5 transition ${
                        syarat[s.key] ? 'border-brand-300 ring-1 ring-brand-100' : 'border-gray-200 hover:border-brand-300'
                      }`}
                    >
                      <span className="relative flex h-5 w-5 shrink-0 items-center justify-center pt-0.5">
                        <input
                          type="checkbox"
                          checked={syarat[s.key]}
                          onChange={() => toggleSyarat(s.key)}
                          className="peer sr-only"
                        />
                        <span
                          className={`flex h-5 w-5 items-center justify-center rounded border-2 transition ${
                            syarat[s.key] ? 'border-brand-600 bg-brand-600' : 'border-gray-300 bg-white'
                          }`}
                        >
                          {syarat[s.key] && (
                            <svg className="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" strokeWidth="3.5" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                            </svg>
                          )}
                        </span>
                      </span>
                      <span className={`text-sm leading-relaxed ${syarat[s.key] ? 'font-medium text-gray-800' : 'text-gray-600'}`}>
                        {s.teks}
                      </span>
                    </label>
                  ))}
                </div>

                {sentuh && !semuaSyaratDisetujui && (
                  <p className="mt-2 text-xs font-medium text-red-600">
                    Kedua pernyataan legal wajib disetujui sebelum menyimpan.
                  </p>
                )}
              </div>
            </div>

            {/* Footer modal */}
            <div className="flex flex-col-reverse items-stretch gap-2 border-t border-gray-100 px-6 py-4 sm:flex-row sm:items-center sm:justify-between">
              <p className="flex items-center gap-1.5 text-xs text-gray-400">
                <Icon name="gembok" className="h-4 w-4 shrink-0" />
                {bolehSimpan ? 'Semua persyaratan terpenuhi.' : 'Lengkapi seluruh isian & pernyataan legal.'}
              </p>

              <div className="flex justify-end gap-2">
                <button
                  type="button"
                  onClick={tutup}
                  className="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-semibold text-gray-600 transition hover:bg-gray-50"
                >
                  Batal
                </button>
                <button
                  type="button"
                  onClick={simpan}
                  disabled={!bolehSimpan}
                  className={`inline-flex items-center gap-2 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition ${
                    bolehSimpan ? 'hover:bg-brand-700' : 'cursor-not-allowed opacity-50'
                  }`}
                >
                  <Icon name="centang" className="h-5 w-5" />
                  Simpan Portofolio
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* =========================================================
       KOMPONEN: Toast
       ========================================================= */
    const Toast = ({ pesan }) => {
      if (!pesan) return null;
      return (
        <div className="fixed bottom-6 right-6 z-[80] flex max-w-sm items-center gap-3 rounded-xl bg-gray-900 px-5 py-3 text-sm font-medium text-white shadow-2xl">
          <Icon name="centangLingkaran" className="h-5 w-5 shrink-0 text-brand-400" />
          <span>{pesan}</span>
        </div>
      );
    };

    /* =========================================================
       KOMPONEN UTAMA
       ========================================================= */
    const App = () => {
      const [sidebarTerbuka, setSidebarTerbuka] = useState(false);
      const [modalTerbuka, setModalTerbuka] = useState(false);
      const [toast, setToast] = useState('');

      const [portofolio, setPortofolio] = useState([
        { subId: PREFIX_NIB + '-001', nama: 'Tanah Jl. Merdeka', lokasi: 'Semarang, Jawa Tengah', kategori: 'Wakaf Tanah', kategoriId: 'tanah', satuan: 'M²', nilai: 500, status: 'Aktif' },
        { subId: PREFIX_NIB + '-002', nama: 'BSI KCP Sudirman', lokasi: 'Rek. Wakaf Produktif', kategori: 'Wakaf Uang', kategoriId: 'uang', satuan: 'Rp', nilai: 1000000000, status: 'Aktif' },
      ]);

      // Sub-ID selalu diturunkan dari prefix NIB lembaga
      const subIdBerikutnya = useMemo(
        () => PREFIX_NIB + '-' + String(portofolio.length + 1).padStart(3, '0'),
        [portofolio.length]
      );

      const tampilkanToast = (pesan) => {
        setToast(pesan);
        setTimeout(() => setToast(''), 3600);
      };

      const simpanPortofolio = (data) => {
        setPortofolio((prev) => [
          ...prev,
          {
            subId: data.subId,
            nama: data.nama,
            lokasi: data.kategoriId === 'uang' ? 'Rek. Wakaf Produktif' : 'Lokasi aset wakaf',
            kategori: data.kategori,
            kategoriId: data.kategoriId,
            satuan: data.satuan,
            nilai: data.nilai,
            status: 'Menunggu Validasi',
          },
        ]);
        setModalTerbuka(false);
        tampilkanToast(`Portofolio ${data.subId} berhasil ditambahkan dengan ${data.dokumen} dokumen persyaratan.`);
      };

      const tampilNilai = (p) =>
        p.satuan === 'Rp' ? 'Rp ' + p.nilai.toLocaleString('id-ID') : p.nilai.toLocaleString('id-ID') + ' M²';

      return (
        <div className="flex h-screen overflow-hidden">
          <Sidebar terbuka={sidebarTerbuka} tutup={() => setSidebarTerbuka(false)} />

          {/* Overlay mobile */}
          {sidebarTerbuka && (
            <div
              onClick={() => setSidebarTerbuka(false)}
              className="fixed inset-0 z-40 bg-black/40 lg:hidden"
            ></div>
          )}

          <div className="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
            <Header bukaSidebar={() => setSidebarTerbuka(true)} />

            <main>
              <div className="mx-auto max-w-screen-2xl space-y-6 p-4 md:p-6">

                {/* Judul halaman */}
                <div>
                  <h2 className="text-xl font-bold text-gray-800 md:text-2xl">Master Data Aset &amp; Portofolio Wakaf</h2>
                  <p className="mt-1 text-sm text-gray-500">
                    Seluruh aset wakaf lembaga Anda terkonsolidasi dalam satu Nomor Induk BWI (NIB) — tanpa perlu mendaftar akun lembaga baru.
                  </p>
                </div>

                {/* Kartu NIB */}
                <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-brand-800 to-brand-600 p-6 shadow-default md:p-8">
                  <div className="relative z-10 flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
                    <div>
                      <div className="flex items-center gap-2.5">
                        <span className="flex h-9 w-9 items-center justify-center rounded-lg bg-white/15">
                          <Icon name="kartu" className="h-5 w-5 text-white" />
                        </span>
                        <span className="text-sm font-semibold text-brand-100">Nomor Induk BWI (NIB)</span>
                      </div>
                      <h2 className="mt-3 font-mono text-3xl font-bold tracking-wider text-white md:text-4xl">{NIB_LEMBAGA}</h2>
                      <p className="mt-1 text-sm text-brand-100">Satu Identitas untuk Seluruh Pengelolaan Aset Wakaf Anda.</p>
                    </div>

                    <div className="flex items-center gap-3 rounded-xl bg-white/10 px-5 py-4 backdrop-blur-sm">
                      <Icon name="bangunan" className="h-7 w-7 text-white" />
                      <div>
                        <p className="text-2xl font-bold text-white">{portofolio.length} Sub-ID</p>
                        <p className="text-xs text-brand-100">Portofolio Aktif</p>
                      </div>
                    </div>
                  </div>
                  <div className="absolute -right-10 -top-10 h-48 w-48 rounded-full bg-white/5"></div>
                  <div className="absolute -bottom-16 right-24 h-56 w-56 rounded-full bg-white/5"></div>
                </div>

                {/* Card tabel portofolio */}
                <div className="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-card">
                  <div className="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 md:flex-row md:items-center md:justify-between md:px-6">
                    <div>
                      <h3 className="text-base font-bold text-gray-800">Daftar Portofolio Aset Terdaftar</h3>
                      <p className="text-xs text-gray-400">Seluruh Sub-ID aset yang berada di bawah satu NIB lembaga.</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setModalTerbuka(true)}
                      className="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-brand-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-200"
                    >
                      <Icon name="tambah" className="h-5 w-5" />
                      Tambah Portofolio Baru
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full min-w-[880px] text-sm">
                      <thead>
                        <tr className="border-b border-gray-100 bg-gray-50 text-left">
                          <th className="px-5 py-3.5 text-xs font-semibold uppercase tracking-wide text-gray-500 md:px-6">Sub-ID Aset</th>
                          <th className="px-5 py-3.5 text-xs font-semibold uppercase tracking-wide text-gray-500 md:px-6">Kategori Wakaf</th>
                          <th className="px-5 py-3.5 text-xs font-semibold uppercase tracking-wide text-gray-500 md:px-6">Nama / Lokasi Aset</th>
                          <th className="px-5 py-3.5 text-xs font-semibold uppercase tracking-wide text-gray-500 md:px-6">Nilai / Luas Dasar</th>
                          <th className="px-5 py-3.5 text-xs font-semibold uppercase tracking-wide text-gray-500 md:px-6">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {portofolio.map((p) => {
                          const uang = p.kategoriId === 'uang';
                          const aktif = p.status === 'Aktif';
                          return (
                            <tr key={p.subId} className="transition hover:bg-gray-50">
                              <td className="whitespace-nowrap px-5 py-4 font-mono text-xs font-semibold text-gray-700 md:px-6">{p.subId}</td>
                              <td className="px-5 py-4 md:px-6">
                                <span className={`inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-xs font-medium ${uang ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'}`}>
                                  <Icon name={uang ? 'uang' : 'tanah'} className="h-3.5 w-3.5" />
                                  {p.kategori}
                                </span>
                              </td>
                              <td className="px-5 py-4 md:px-6">
                                <p className="font-medium text-gray-800">{p.nama}</p>
                                <p className="text-xs text-gray-400">{p.lokasi}</p>
                              </td>
                              <td className="whitespace-nowrap px-5 py-4 font-semibold text-gray-800 md:px-6">{tampilNilai(p)}</td>
                              <td className="px-5 py-4 md:px-6">
                                <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ${aktif ? 'bg-brand-50 text-brand-700' : 'bg-amber-50 text-amber-700'}`}>
                                  <span className={`h-1.5 w-1.5 rounded-full ${aktif ? 'bg-brand-500' : 'bg-amber-500'}`}></span>
                                  {p.status}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex items-start gap-3 border-t border-gray-100 bg-gray-50 px-5 py-4 md:px-6">
                    <Icon name="info" className="mt-0.5 h-5 w-5 shrink-0 text-gray-400" />
                    <p className="text-xs text-gray-500">
                      Setiap penambahan aset baru akan didaftarkan sebagai <span className="font-semibold text-gray-600">Sub-ID</span> di
                      bawah NIB yang sama — bukan sebagai lembaga Nazhir baru. Nomor Sub-ID diturunkan otomatis dari NIB lembaga
                      (<span className="font-mono font-semibold text-gray-600">{PREFIX_NIB}</span> + nomor urut), sehingga portofolio
                      berikutnya menjadi <span className="font-mono font-semibold text-gray-600">{subIdBerikutnya}</span>.
                    </p>
                  </div>
                </div>
              </div>
            </main>

            <footer className="border-t border-gray-200 bg-white py-4 text-center text-xs text-gray-400">
              Badan Wakaf Indonesia &copy; 2026 &middot; Titik Terang OS &middot; Modul Kenazhiran
            </footer>
          </div>

          <ModalTambahPortofolio
            terbuka={modalTerbuka}
            tutup={() => setModalTerbuka(false)}
            onSimpan={simpanPortofolio}
            subIdBerikutnya={subIdBerikutnya}
          />

          <Toast pesan={toast} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
