<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat Keputusan (SK) Nazhir | Modul Kenazhiran BWI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' } },
          maxWidth: { 'screen-2xl': '1536px' },
          boxShadow: { 'card': '0px 1px 3px rgba(0,0,0,0.06), 0px 1px 2px rgba(0,0,0,0.04)' }
        }
      }
    }
  </script>
  <style>
    body, html { font-family: 'Outfit', sans-serif !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    @media print {
      body { background: #fff !important; }
      .no-print { display: none !important; }
      #skPaper { box-shadow: none !important; margin: 0 !important; max-width: 100% !important; }
    }
  </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800 antialiased">

  <!-- Top bar -->
  <header class="no-print sticky top-0 z-30 border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-[68px] max-w-screen-2xl items-center gap-3 px-4 md:px-6">
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand-600">
        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" /></svg>
      </span>
      <div class="min-w-0">
        <h1 class="truncate text-base font-bold leading-tight text-gray-800">Sertifikat Keputusan (SK) Nazhir</h1>
        <p class="truncate text-xs text-gray-400">Dokumen penetapan sebagai Nazhir Wakaf Uang</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <a href="nazhir-dashboard.html" class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 transition hover:bg-gray-50">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
          Dashboard
        </a>
        <button id="btnUnduh" onclick="window.print()" class="hidden items-center gap-1.5 rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-700">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
          Download / Cetak
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-screen-2xl p-4 md:p-6">
    <!-- Belum tersedia -->
    <div id="skKosong" class="hidden">
      <div class="mx-auto max-w-lg rounded-2xl border border-gray-200 bg-white px-6 py-16 text-center shadow-card">
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-400"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg></span>
        <h3 class="mt-4 text-lg font-bold text-gray-800">SK belum tersedia</h3>
        <p class="mt-1 text-sm text-gray-500">Sertifikat Keputusan (SK) Nazhir akan terbit otomatis setelah pendaftaran Anda disetujui BWI Pusat.</p>
        <a href="nazhir-dashboard.html" class="mt-5 inline-flex rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700">Kembali ke Dashboard</a>
      </div>
    </div>

    <!-- SK tersedia -->
    <div id="skWrap" class="hidden">
      <div class="no-print mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-brand-200 bg-brand-50 px-5 py-4">
        <div class="flex items-start gap-3">
          <svg class="mt-0.5 h-5 w-5 shrink-0 text-brand-600" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
          <div><p class="text-sm font-bold text-brand-800">SK Anda telah terbit</p><p id="skMeta" class="mt-0.5 text-xs text-brand-700"></p></div>
        </div>
        <button onclick="window.print()" class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-brand-700">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
          Download / Cetak
        </button>
      </div>
      <div class="rounded-2xl bg-gray-100 p-4 sm:p-8">
        <div id="skPaper" class="mx-auto max-w-[720px] bg-white p-8 text-sm leading-relaxed text-gray-800 shadow-lg sm:p-12" style="font-family: 'Times New Roman', Georgia, serif;"></div>
      </div>
    </div>
  </main>

  <script>
    const KUNCI_DAFTAR = 'pendaftaran_nazhir_bwi';
    function bacaDaftar() { try { const o = JSON.parse(localStorage.getItem(KUNCI_DAFTAR)); if (o && typeof o === 'object') return o; } catch (e) {} return null; }
    function amankan(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function tglHariIni() { const b = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember']; const d = new Date(); return d.getDate() + ' ' + b[d.getMonth()] + ' ' + d.getFullYear(); }

    function qrKode(seed, px) {
      const N = 25, s = px || 96, cell = s / N, sd = String(seed || 'BWI');
      let h = 2166136261;
      for (let i = 0; i < sd.length; i++) { h ^= sd.charCodeAt(i); h = Math.imul(h, 16777619); }
      function rnd(i) { let x = Math.imul((h ^ (i * 2654435761)) >>> 0, 2246822519); x ^= x >>> 13; return ((x >>> 0) % 1000) / 1000; }
      const on = {}; const set = (x, y) => { on[x + '_' + y] = true; };
      function finder(gx, gy) { for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) { const edge = (x === 0 || x === 6 || y === 0 || y === 6), core = (x >= 2 && x <= 4 && y >= 2 && y <= 4); if (edge || core) set(gx + x, gy + y); } }
      finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
      const inF = (x, y) => (x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8);
      let idx = 0;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (inF(x, y)) continue; if (rnd(idx++) > 0.5) set(x, y); }
      let r = '';
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (on[x + '_' + y]) r += '<rect x="' + (x * cell).toFixed(2) + '" y="' + (y * cell).toFixed(2) + '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="' + s + '" height="' + s + '" fill="#fff"/><g fill="#0f172a">' + r + '</g></svg>';
    }
    function skHTML(d) {
      const nama = amankan(d.namaBadanHukum || '-');
      const pic = amankan(d.pic || '-');
      const nib = amankan(d.nib || '-');
      const tgl = amankan(d.tglSertifikat || tglHariIni());
      const nomor = 'SK-' + (d.nib || 'NZHR-000') + '/BWI/' + (String(tgl).split(' ').pop() || '2026');
      const namaKetua = amankan(d.ttdOleh || 'Prof. Dr. K.H. Noor Achmad, M.A.');
      return '' +
        '<div style="text-align:center;border-bottom:3px double #0f766e;padding-bottom:14px;margin-bottom:20px;">' +
          '<p style="margin:0;font-size:15px;font-weight:bold;letter-spacing:.5px;">BADAN WAKAF INDONESIA</p>' +
          '<p style="margin:2px 0 0;font-size:11px;">Jl. Kebon Sirih Nomor 57, Jakarta Pusat 10340 · www.bwi.go.id</p>' +
        '</div>' +
        '<div style="text-align:center;margin-bottom:18px;">' +
          '<p style="margin:0;font-weight:bold;text-decoration:underline;">SURAT KEPUTUSAN KETUA BADAN WAKAF INDONESIA</p>' +
          '<p style="margin:4px 0;">Nomor: ' + amankan(nomor) + '</p>' +
          '<p style="margin:8px 0 0;">TENTANG</p>' +
          '<p style="margin:2px 0;font-weight:bold;">PENETAPAN DAN PENDAFTARAN NAZHIR WAKAF UANG</p>' +
        '</div>' +
        '<p style="margin:0 0 8px;">Ketua Badan Wakaf Indonesia, setelah melakukan verifikasi dokumen dan penilaian presentasi/wawancara:</p>' +
        '<table style="width:100%;border-collapse:collapse;margin-bottom:12px;">' +
          '<tr><td style="width:120px;vertical-align:top;padding:2px 0;">Menimbang</td><td style="width:14px;vertical-align:top;">:</td><td style="padding:2px 0;">bahwa ' + nama + ' telah memenuhi persyaratan administratif dan kompetensi sebagai Nazhir Wakaf Uang sesuai ketentuan peraturan perundang-undangan yang berlaku;</td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">Mengingat</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">Undang-Undang No. 41 Tahun 2004 tentang Wakaf serta Peraturan BWI tentang Pendaftaran Nazhir Wakaf Uang;</td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">Memperhatikan</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">hasil verifikasi berkas dan hasil presentasi/wawancara yang dinyatakan <b>LULUS</b>' + (d.catatanHasil ? ' dengan catatan: “' + amankan(d.catatanHasil) + '”' : '') + ';</td></tr>' +
        '</table>' +
        '<p style="text-align:center;font-weight:bold;margin:14px 0;">MEMUTUSKAN</p>' +
        '<table style="width:100%;border-collapse:collapse;">' +
          '<tr><td style="width:120px;vertical-align:top;padding:2px 0;">Menetapkan</td><td style="width:14px;vertical-align:top;">:</td><td style="padding:2px 0;"></td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">KESATU</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">Menetapkan <b>' + nama + '</b> sebagai <b>Nazhir Wakaf Uang</b> yang terdaftar pada Badan Wakaf Indonesia.</td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">KEDUA</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">Nomor Induk Nazhir (NIB): <b>' + nib + '</b>, dengan penanggung jawab (PIC): ' + pic + '.</td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">KETIGA</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">Nazhir wajib menyampaikan laporan pengelolaan dan pengembangan harta benda wakaf secara berkala sesuai ketentuan yang berlaku.</td></tr>' +
          '<tr><td style="vertical-align:top;padding:2px 0;">KEEMPAT</td><td style="vertical-align:top;">:</td><td style="padding:2px 0;">Keputusan ini berlaku sejak tanggal ditetapkan dan akan ditinjau kembali apabila terdapat kekeliruan di kemudian hari.</td></tr>' +
        '</table>' +
        '<div style="display:flex;justify-content:flex-end;align-items:flex-end;margin-top:34px;">' +
          '<div style="text-align:center;min-width:260px;">' +
            '<p style="margin:0;">Ditetapkan di Jakarta,</p>' +
            '<p style="margin:0 0 4px;">pada tanggal ' + tgl + '</p>' +
            '<p style="margin:0;">Ketua Badan Wakaf Indonesia,</p>' +
            '<div style="margin:6px auto 2px;width:100px;height:100px;padding:4px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;">' + qrKode(d.ttdId || d.nib || nomor, 92) + '</div>' +
            '<p style="margin:2px 0 0;font-size:10px;font-weight:bold;color:#0f766e;font-family:Arial,sans-serif;">&#10003; Terverifikasi — Ketua BWI</p>' +
            '<p style="margin:2px 0 0;font-weight:bold;text-decoration:underline;">' + namaKetua + '</p>' +
            '<p style="margin:2px 0 0;font-size:10px;color:#64748b;font-family:Arial,sans-serif;">Ditandatangani secara elektronik</p>' +
            '<p style="margin:1px 0 0;font-size:9px;color:#94a3b8;font-family:Arial,sans-serif;">ID: ' + amankan(d.ttdId || '-') + '</p>' +
          '</div>' +
        '</div>';
    }

    document.addEventListener('DOMContentLoaded', function () {
      const d = bacaDaftar();
      const ada = d && d.status === 'aktif' && d.nib;
      if (!ada) { document.getElementById('skKosong').classList.remove('hidden'); return; }
      document.getElementById('skWrap').classList.remove('hidden');
      document.getElementById('btnUnduh').classList.remove('hidden');
      document.getElementById('btnUnduh').classList.add('inline-flex');
      document.getElementById('skMeta').textContent = 'NIB ' + d.nib + ' · Terbit ' + (d.tglSertifikat || '-');
      document.getElementById('skPaper').innerHTML = skHTML(d);
    });
  </script>
</body>

</html>
